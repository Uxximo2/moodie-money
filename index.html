
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Moodie Money</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1C1C1E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="아껴쓰자">
<link rel="apple-touch-icon" href="/icon-192.png">

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
<style>
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--label:#8E8E93;--sep:#E5E5EA;
  --green:#34C759;--red:#FF3B30;--blue:#007AFF;--orange:#FF9500;
  --purple:#AF52DE;--text:#000;--text2:#3C3C43;
  --r:13px;--r-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;
  padding-bottom:80px}

/* TOP NAV */
.top-nav{background:rgba(242,242,247,.92);backdrop-filter:blur(20px);
  position:sticky;top:0;z-index:100;padding:16px 20px 12px}
.month-nav{display:flex;align-items:center;justify-content:center;gap:16px}
.month-nav button{background:var(--card);border:none;width:32px;height:32px;border-radius:50%;
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.12);transition:transform .1s;color:var(--blue)}
.month-nav button:active{transform:scale(.9)}
.month-label{font-size:20px;font-weight:700;min-width:130px;text-align:center;
  cursor:pointer;padding:4px 10px;border-radius:8px;transition:background .15s}
.month-label:active{background:rgba(0,0,0,.06)}

/* BOTTOM TAB BAR */
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:rgba(249,249,249,.95);
  backdrop-filter:blur(20px);border-top:1px solid var(--sep);
  display:flex;z-index:100;padding:8px 0 env(safe-area-inset-bottom,8px)}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;cursor:pointer;padding:4px 0}
.tab-btn .t-icon{font-size:22px;line-height:1}
.tab-btn .t-label{font-size:10px;font-weight:600;color:var(--label)}
.tab-btn.active .t-label{color:var(--blue)}

/* PAGES */
.page{display:none}.page.active{display:block}

/* BALANCE CARD */
.balance-card{margin:12px 16px 0;background:linear-gradient(135deg,#1C1C1E,#2C2C2E);
  border-radius:20px;padding:22px 22px 18px;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.bal-label{font-size:12px;color:rgba(255,255,255,.55);font-weight:500;margin-bottom:3px}
.bal-amount{font-size:34px;font-weight:700;letter-spacing:-1px;cursor:pointer;display:inline-block}
.bal-row{display:flex;gap:16px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1)}
.currency-toggle{display:inline-flex;background:rgba(255,255,255,.12);border:none;
  border-radius:20px;padding:4px 10px;font-size:12px;font-weight:700;color:#fff;
  cursor:pointer;gap:6px;align-items:center;margin-top:6px;transition:background .15s}
.currency-toggle:active{background:rgba(255,255,255,.22)}
.cur-opt{opacity:.5;transition:opacity .15s}
.cur-opt.active{opacity:1}
.bal-item{flex:1}
.bl{font-size:11px;color:rgba(255,255,255,.5);font-weight:500}
.bv{font-size:16px;font-weight:700;margin-top:2px}
.bv-green{color:#30D158}.bv-red{color:#FF453A}

/* SEG CTRL */
.seg-ctrl{display:flex;background:var(--sep);border-radius:10px;padding:3px;margin:16px 16px 4px}
.seg-btn{flex:1;background:transparent;border:none;border-radius:8px;padding:7px;
  font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--label);font-family:inherit}
.seg-btn.active{background:var(--card);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* CAT GRID */
.sec-hdr{font-size:20px;font-weight:700}
.sec-row{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px}
.quick-add-btn{background:var(--blue);color:#fff;border:none;width:30px;height:30px;
  border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;transition:transform .1s,opacity .1s}
.quick-add-btn:active{transform:scale(.9);opacity:.8}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 16px}
.cat-btn{background:var(--card);border:none;border-radius:var(--r);padding:14px 6px 12px;
  cursor:pointer;transition:transform .15s;box-shadow:0 1px 4px rgba(0,0,0,.07);
  display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;overflow:hidden}
.cat-btn:active{transform:scale(.94)}
.cat-icon{font-size:26px;line-height:1}
.cat-name{font-size:12px;font-weight:600;color:var(--text2)}
.cat-amt{font-size:11px;color:var(--label)}
.cat-badge{position:absolute;top:6px;right:6px;background:var(--red);color:#fff;
  font-size:9px;font-weight:700;border-radius:6px;padding:1px 5px}

/* TX LIST */
.tx-list{margin:0 16px;background:var(--card);border-radius:var(--r);overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.07)}
.tx-item{display:flex;align-items:center;padding:12px 16px;gap:12px;
  border-bottom:1px solid var(--sep);cursor:pointer;transition:background .1s}
.tx-item:last-child{border-bottom:none}
.tx-item:active{background:var(--bg)}
.tx-ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;
  justify-content:center;font-size:20px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-cat{font-size:15px;font-weight:600}
.tx-sub{font-size:13px;color:var(--label);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-right{text-align:right;flex-shrink:0}
.tx-amt{font-size:15px;font-weight:600}
.tx-amt.inc{color:var(--green)}.tx-amt.exp{color:var(--red)}
.tx-dt{font-size:12px;color:var(--label);margin-top:1px}
.tx-empty{padding:32px;text-align:center;color:var(--label);font-size:14px}

/* MODALS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;
  display:none;align-items:flex-end}
.overlay.open{display:flex;animation:fadeIn .2s}
.overlay.center{align-items:center;justify-content:center}
.overlay.center .sheet{border-radius:20px;max-height:88vh;width:calc(100% - 32px);max-width:480px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);border-radius:20px 20px 0 0;width:100%;
  max-height:92vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.32,.72,0,1);
  padding-bottom:env(safe-area-inset-bottom,20px)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.handle{width:36px;height:5px;background:var(--sep);border-radius:3px;margin:10px auto 0}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px}
.modal-hdr-left{display:flex;align-items:center;gap:10px}
.modal-icon-big{font-size:28px}
.modal-title{font-size:20px;font-weight:700}
.x-btn{background:var(--sep);border:none;width:30px;height:30px;border-radius:50%;
  font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--label)}
.x-btn:active{background:#D1D1D6}

/* FORM */
.form-body{padding:8px 20px 0}
.f-label{font-size:12px;font-weight:600;color:var(--label);text-transform:uppercase;
  letter-spacing:.4px;margin-bottom:6px;display:block;margin-top:14px}
.f-input{width:100%;background:var(--bg);border:none;border-radius:var(--r-sm);
  padding:13px 14px;font-size:16px;font-family:inherit;color:var(--text);outline:none;
  transition:box-shadow .15s;-webkit-appearance:none}
.f-input:focus{box-shadow:0 0 0 3px rgba(0,122,255,.2)}
.f-input.big{font-size:24px;font-weight:700;text-align:right;letter-spacing:-.5px}
.card-row{display:flex;gap:7px;flex-wrap:wrap}
.chip{background:var(--bg);border:2px solid transparent;border-radius:20px;
  padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;
  color:var(--text2);font-family:inherit}
.chip.sel{background:#E8F1FF;border-color:var(--blue);color:var(--blue)}
.sub-btn{width:100%;background:var(--blue);color:#fff;border:none;border-radius:var(--r);
  padding:16px;font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;
  margin:16px 0 8px;transition:opacity .15s,transform .1s}
.sub-btn:active{opacity:.85;transform:scale(.98)}
.sub-btn:disabled{opacity:.5}
.sub-btn.green{background:var(--green)}
.del-btn{width:calc(100% - 40px);margin:12px 20px 8px;background:#FFF0EF;color:var(--red);
  border:none;border-radius:var(--r);padding:14px;font-size:16px;font-weight:600;
  font-family:inherit;cursor:pointer}
.del-btn:active{opacity:.7}
.detail-row{display:flex;justify-content:space-between;align-items:center;
  padding:13px 20px;border-bottom:1px solid var(--sep)}
.detail-row:last-child{border-bottom:none}
.dk{font-size:15px;color:var(--label)}.dv{font-size:15px;font-weight:600}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px 12px 16px}
.cal-dow{text-align:center;font-size:11px;font-weight:600;color:var(--label);padding:6px 0}
.cal-dow:first-child{color:var(--red)}.cal-dow:last-child{color:var(--blue)}
.cal-day{background:var(--bg);border-radius:10px;padding:5px 3px;min-height:62px;
  display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:background .1s}
.cal-day:active{background:var(--sep)}
.cal-day.today .cal-num{background:var(--blue);color:#fff;border-radius:50%;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center}
.cal-day.empty{background:transparent;cursor:default;pointer-events:none}
.cal-num{font-size:13px;font-weight:600;margin-bottom:3px;width:22px;height:22px;
  display:flex;align-items:center;justify-content:center}
.cal-num.sun{color:var(--red)}.cal-num.sat{color:var(--blue)}
.cal-inc{font-size:9px;font-weight:600;color:var(--green);line-height:1.3;text-align:center}
.cal-exp{font-size:9px;font-weight:600;color:var(--red);line-height:1.3;text-align:center}

/* PORTFOLIO */
.port-card{margin:10px 16px;background:var(--card);border-radius:var(--r);overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.07)}
.port-hdr-row{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 10px}
.port-hdr-row h3{font-size:17px;font-weight:700}
.add-btn{background:var(--blue);color:#fff;border:none;border-radius:20px;
  padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.port-summary{display:flex;gap:10px;padding:0 16px 14px}
.port-sum-item{flex:1;background:var(--bg);border-radius:10px;padding:12px;text-align:center}
.ps-label{font-size:11px;color:var(--label);font-weight:500}
.ps-val{font-size:15px;font-weight:700;margin-top:3px}
.stock-item{display:flex;align-items:center;padding:12px 16px;gap:12px;
  border-top:1px solid var(--sep);cursor:pointer;transition:background .1s}
.stock-item:active{background:var(--bg)}
.stock-ico{width:38px;height:38px;border-radius:10px;background:var(--blue);
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:11px;font-weight:700;flex-shrink:0;overflow:hidden}
.stock-ico img{width:100%;height:100%;object-fit:cover;border-radius:10px}
.stock-info{flex:1;min-width:0}
.stock-name{font-size:15px;font-weight:600}
.stock-sub{font-size:12px;color:var(--label);margin-top:1px}
.stock-right{text-align:right}
.stock-val{font-size:15px;font-weight:600}
.stock-ret{font-size:12px;font-weight:600;margin-top:2px}
.ret-pos{color:var(--green)}.ret-neg{color:var(--red)}

/* MARKET TILES */
.mkt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:0 16px 8px}
.mkt-tile{background:var(--card);border-radius:12px;padding:12px 10px;
  box-shadow:0 1px 4px rgba(0,0,0,.07);text-align:center}
.mkt-name{font-size:10px;font-weight:600;color:var(--label);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.mkt-val{font-size:14px;font-weight:700;letter-spacing:-.3px}
.mkt-chg{font-size:11px;font-weight:600;margin-top:2px}
.mkt-up{color:var(--green)}.mkt-dn{color:var(--red)}.mkt-flat{color:var(--label)}

/* WATCHLIST */
.watch-item{display:flex;align-items:center;padding:12px 16px;gap:12px;
  border-top:1px solid var(--sep);cursor:pointer;transition:background .1s}
.watch-item:active{background:var(--bg)}
.watch-ico{width:38px;height:38px;border-radius:10px;background:var(--purple);
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex-shrink:0}
.watch-info{flex:1;min-width:0}
.watch-name{font-size:15px;font-weight:600}
.watch-sub{font-size:12px;color:var(--label);margin-top:1px}
.watch-note{font-size:13px;color:var(--label)}

/* SETTINGS */
.settings-section{margin:0 16px 16px;background:var(--card);border-radius:var(--r);overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.07)}
.settings-row{display:flex;align-items:center;justify-content:space-between;
  padding:13px 16px;border-top:1px solid var(--sep);cursor:pointer;transition:background .1s}
.settings-row:first-child{border-top:none}
.settings-row:active{background:var(--bg)}
.sr-left{display:flex;align-items:center;gap:10px}
.sr-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.sr-text{font-size:16px;font-weight:500}
.sr-arrow{color:var(--label);font-size:14px}
.settings-hdr-label{font-size:13px;font-weight:600;color:var(--label);
  text-transform:uppercase;letter-spacing:.4px;padding:14px 20px 6px;display:block}

/* USER PROFILE CARD */
.profile-card{margin:0 16px 16px;background:linear-gradient(135deg,#1C1C1E,#2C2C2E);
  border-radius:var(--r);padding:20px;color:#fff;display:flex;align-items:center;gap:14px}
.profile-avatar{width:52px;height:52px;border-radius:50%;background:var(--blue);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;flex-shrink:0}
.profile-info{flex:1}
.profile-name{font-size:18px;font-weight:700}
.profile-sub{font-size:13px;color:rgba(255,255,255,.55);margin-top:2px}
.logout-btn{background:rgba(255,255,255,.12);border:none;color:#fff;
  border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}

/* LOGIN FORM */
.login-card{margin:16px;background:var(--card);border-radius:var(--r);padding:24px;
  box-shadow:0 1px 4px rgba(0,0,0,.07)}
.login-title{font-size:22px;font-weight:700;margin-bottom:4px}
.login-sub{font-size:14px;color:var(--label);margin-bottom:20px}
.login-tabs{display:flex;background:var(--sep);border-radius:8px;padding:3px;margin-bottom:18px}
.login-tab{flex:1;background:transparent;border:none;border-radius:6px;padding:7px;
  font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;color:var(--label);font-family:inherit}
.login-tab.active{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.login-err{font-size:13px;color:var(--red);margin-top:8px;min-height:18px;text-align:center}

/* CAT EDITOR */
.cat-edit-list{padding:0 20px}
.cat-edit-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--sep)}
.cat-edit-item:last-child{border-bottom:none}
.cat-edit-ico{font-size:22px;cursor:pointer;background:none;border:none;padding:2px}
.cat-edit-input{flex:1;background:var(--bg);border:none;border-radius:8px;
  padding:9px 12px;font-size:15px;font-family:inherit;color:var(--text);outline:none}
.cat-edit-input:focus{box-shadow:0 0 0 2px rgba(0,122,255,.2)}
.cat-del-btn{background:none;border:none;color:var(--red);font-size:20px;cursor:pointer;padding:4px;line-height:1}
.add-cat-row{display:flex;gap:10px;padding:12px 20px 4px;align-items:center}
.add-cat-ico-btn{background:var(--bg);border:none;border-radius:8px;padding:9px;font-size:22px;cursor:pointer;font-family:inherit}
.add-cat-inp{flex:1;background:var(--bg);border:none;border-radius:8px;
  padding:9px 12px;font-size:15px;font-family:inherit;color:var(--text);outline:none}
.add-cat-inp:focus{box-shadow:0 0 0 2px rgba(0,122,255,.2)}
.add-cat-confirm{background:var(--blue);color:#fff;border:none;border-radius:8px;
  padding:9px 14px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}

/* EMOJI */
.emoji-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px 20px;max-height:220px;overflow-y:auto}
.e-btn{background:var(--bg);border:none;border-radius:8px;padding:8px;font-size:22px;cursor:pointer;text-align:center}
.e-btn:active{background:var(--sep)}

/* NOTICE */
.notice{margin:0 16px 12px;background:#EAF4FF;border-radius:10px;padding:12px 14px;
  font-size:13px;color:#005EA8;line-height:1.5}
.notice strong{font-weight:700}
.notice.gray{background:#F0F0F5;color:#444}

/* DAY DETAIL */
.day-tx-item{display:flex;align-items:center;padding:10px 16px;gap:10px;border-bottom:1px solid var(--sep)}
.day-tx-item:last-child{border-bottom:none}

.bottom-pad{height:20px}

/* CARD SUMMARY CHIPS */
.card-sum-chip{background:var(--card);border:none;border-radius:14px;padding:12px 14px;
  cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:0 1px 4px rgba(0,0,0,.08);
  display:flex;flex-direction:column;align-items:center;gap:4px;min-width:80px;flex-shrink:0}
.card-sum-chip:active{transform:scale(.95)}
.card-sum-chip.has-txs{background:linear-gradient(135deg,#1C1C1E,#2C2C2E);color:#fff}
.csc-name{font-size:13px;font-weight:700}
.csc-amt{font-size:12px;font-weight:600;color:var(--red)}
.card-sum-chip.has-txs .csc-amt{color:#FF6B6B}
.csc-cnt{font-size:10px;color:var(--label)}
.card-sum-chip.has-txs .csc-cnt{color:rgba(255,255,255,.5)}

/* PORTFOLIO GROUPS */
.port-total-card{margin:10px 16px 6px;background:#1C1C1E;border-radius:var(--r);padding:16px;color:#fff}
.port-total-label{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:3px}
.port-total-amt{font-size:26px;font-weight:700;letter-spacing:-.5px;cursor:pointer}
.port-total-pct{font-size:13px;font-weight:600;margin-top:2px}
.port-total-toggle{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:6px;
  padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:8px}
.group-section{margin:0 16px 10px}
.group-hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 0 6px}
.group-hdr-left{display:flex;align-items:center;gap:8px}
.group-name{font-size:16px;font-weight:700}
.group-rename-btn{background:var(--bg);border:0.5px solid var(--sep);border-radius:6px;
  padding:3px 8px;font-size:11px;color:var(--label);cursor:pointer;font-family:inherit}
.group-return{background:var(--bg);border-radius:6px;padding:4px 10px;cursor:pointer;text-align:right}
.group-return-amt{font-size:13px;font-weight:600}
.group-add-btn{width:26px;height:26px;background:var(--blue);border:none;border-radius:50%;
  color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.group-stocks{background:var(--card);border-radius:var(--r);overflow:hidden;
  box-shadow:0 1px 4px rgba(0,0,0,.07)}
.new-group-card{margin:0 16px 16px;border:1.5px dashed var(--sep);border-radius:var(--r);
  padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;color:var(--label);background:transparent}
.new-group-card:active{background:var(--bg)}
.edit-stock-btn{background:var(--bg);border:0.5px solid var(--sep);border-radius:6px;

<script>
// ═══════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════
const CARDS=['NH','Toss','Hana','Hyundai','Iron BCC','계좌이체'];
const EMOJIS=['💰','💼','✨','🍚','☕','🎬','🚇','💊','🛒','🏪','📱','🍺','💈','👕','🎁','🎮','✈️','🏦',
  '🎵','🐾','🍕','🍜','🧴','💄','📚','🏋️','⚽','🎯','🎪','💻','🚗','🏠','💡','🔧','🎨','🌿','🍎','🧸'];
const DEF_INCOME=[{key:'용돈',icon:'💰'},{key:'알바',icon:'💼'},{key:'기타',icon:'✨'}];
const DEF_EXPENSE=[
  {key:'밥',icon:'🍚'},{key:'카페',icon:'☕'},{key:'문화',icon:'🎬'},{key:'교통',icon:'🚇'},
  {key:'의료비',icon:'💊'},{key:'생필품',icon:'🛒'},{key:'편의점',icon:'🏪'},{key:'구독',icon:'📱'},
  {key:'술',icon:'🍺'},{key:'미용',icon:'💈'},{key:'옷',icon:'👕'},{key:'선물',icon:'🎁'},
  {key:'게임',icon:'🎮'},{key:'여행',icon:'✈️'},{key:'적금',icon:'🏦'}
];
const INC_COLORS=['#34C75918','#007AFF18','#AF52DE18'];
const EXP_COLORS=['#FF3B3018','#FF950018','#34C75918','#007AFF18','#30D15818',
  '#5856D618','#FF2D5518','#AC8E6818','#FF6B0018','#FF2D9518',
  '#0071E318','#FF3A5C18','#32ADE618','#5E5CE618','#30B0C718'];

// ═══════════════════════════════════════════
// FIREBASE
// ═══════════════════════════════════════════
let db=null,fbAuth=null,currentUID=null,_unsubData=null,_saveTimer=null;

async function initFirebase(){
  try{
    const r=await fetch('/api/config');
    const cfg=await r.json();
    if(!cfg.apiKey) throw new Error('no config');
    firebase.initializeApp(cfg);
    fbAuth=firebase.auth();
    db=firebase.firestore();
    fbAuth.onAuthStateChanged(user=>{
      if(user){
        currentUID=user.uid;
        listenToUserData(user.uid);
      } else {
        currentUID=null;
        if(_unsubData){_unsubData();_unsubData=null;}
        loadLocalData();
        render();
        if(curPage==='settings') renderSettings();
      }
    });
  } catch(e){
    console.log('Firebase fallback:',e.message);
    loadLocalData(); render();
  }
}

function listenToUserData(uid){
  if(_unsubData) _unsubData();
  _unsubData=db.collection('users').doc(uid).onSnapshot(doc=>{
    if(doc.exists){
      const d=doc.data();
      transactions=d.transactions||[];
      portfolio   =d.portfolio||[];
      watchlist   =d.watchlist||[];
      incCats     =d.incCats||JSON.parse(JSON.stringify(DEF_INCOME));
      expCats     =d.expCats||JSON.parse(JSON.stringify(DEF_EXPENSE));
      groups      =d.groups||[];
    } else {
      loadLocalData();
      saveToFirestore();
    }
    render();
    if(curPage==='port'){renderPortfolio();renderWatchlist();}
    if(curPage==='settings') renderSettings();
  });
}

async function saveToFirestore(){
  if(!db||!currentUID) return;
  try{
    await db.collection('users').doc(currentUID).set({
      transactions,portfolio,watchlist,incCats,expCats,groups,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    });
  } catch(e){console.error('Firestore save:',e);}
}

  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(saveToFirestore,600);
}

// Convert a KRW amount to display currency
function fmt(n, srcCurrency='KRW'){
  const abs=Math.abs(n);
  if(displayCurrency==='USD'){
    const usd = srcCurrency==='USD' ? abs : abs/fxRate;
    return '$'+usd.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  } else {
    const krw = srcCurrency==='USD' ? Math.round(abs*fxRate) : Math.round(abs);
    return '₩'+krw.toLocaleString('ko-KR');
  }
}

// For portfolio prices (stored in native buy currency, current price from Yahoo in native)
function fmtPrice(n, srcCurrency='auto'){
  if(!n && n!==0) return '--';
  // auto: if >= 100, assume KRW; else assume USD
  const src = srcCurrency==='auto' ? (n>=100?'KRW':'USD') : srcCurrency;
  return fmt(n, src);
}
function mKey(){return `${curYear}-${String(curMonth+1).padStart(2,'0')}`}
function mTxs(){return transactions.filter(t=>t.monthKey===mKey())}

function openCalendar(){
  const MO=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calTitle').textContent=`${curYear}년 ${MO[curMonth]}`;
  const grid=document.getElementById('calGrid');
  grid.innerHTML='';
  const DOWS=['일','월','화','수','목','금','토'];
  DOWS.forEach((d,i)=>{
    const el=document.createElement('div');
    el.className='cal-dow';
    el.style.color=i===0?'var(--red)':i===6?'var(--blue)':'var(--label)';
    el.textContent=d;
    grid.appendChild(el);
  });
  const firstDay=new Date(curYear,curMonth,1).getDay();
  const daysInMonth=new Date(curYear,curMonth+1,0).getDate();
  const today=new Date();
  const mk=mKey();
  // Map date -> {inc,exp}
  const dayMap={};
  transactions.filter(t=>t.monthKey===mk).forEach(t=>{
    const day=parseInt((t.date||'').split('/')[1]);
    if(!dayMap[day]) dayMap[day]={inc:0,exp:0};
    if(t.isInc) dayMap[day].inc+=t.amount;
    else dayMap[day].exp+=t.amount;
  });
  // Empty cells
  for(let i=0;i<firstDay;i++){
    const el=document.createElement('div');el.className='cal-day empty';grid.appendChild(el);
  }
  for(let d=1;d<=daysInMonth;d++){
    const dow=(firstDay+d-1)%7;
    const isToday=today.getFullYear()===curYear&&today.getMonth()===curMonth&&today.getDate()===d;
    const data=dayMap[d];
    const el=document.createElement('div');
    el.className='cal-day'+(isToday?' today':'');
    const numClass='cal-num'+(dow===0?' sun':dow===6?' sat':'');
    el.innerHTML=`<span class="${numClass}">${d}</span>
      ${data&&data.inc>0?`<span class="cal-inc">+${fmtShort(data.inc)}</span>`:''}
      ${data&&data.exp>0?`<span class="cal-exp">-${fmtShort(data.exp)}</span>`:''}`;
    el.onclick=()=>openDayDetail(d);
    grid.appendChild(el);
  }
  openOv('calOverlay');
}

function fmtShort(n){
  if(n>=10000000) return (n/10000000).toFixed(1)+'천만';
  if(n>=10000) return Math.round(n/10000)+'만';
  if(n>=1000) return Math.round(n/1000)+'천';
  return n.toLocaleString('ko-KR');
}

async function fetchPrice(ticker){
  if(!ticker)return null;
  try{
    const r=await fetch(`/api/quote?symbol=${encodeURIComponent(ticker)}`);
    if(!r.ok)return null;
    const d=await r.json();
    return d?.price??null;
  }catch{return null}
}

// Stock logo helpers
function stockLogoHtml(ticker, name){
  if(!ticker) return `<span>${name.slice(0,4)}</span>`;
  // Strip exchange suffix for logo lookup (e.g. 005930.KS → 005930, AAPL → AAPL)
  const sym = ticker.split('.')[0];
  const fallback = name.slice(0,4);
  return `<img
    src="https://financialmodelingprep.com/image-stock/${sym}.png"
    alt="${fallback}"
    onerror="this.style.display='none';this.parentNode.innerHTML='<span>${fallback}</span>'"
  >`;
}

// Format a native-currency amount without any conversion
function fmtNative(n, currency){
  if(!n && n!==0) return '--';
  if(currency==='USD') return '$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  return '₩'+Math.round(Math.abs(n)).toLocaleString('ko-KR');
}

function renderPortfolio(){
  const container=document.getElementById('portfolioContent');
  container.innerHTML='';

  // ── Total earnings card ──
  const allCostUSD=portfolio.filter(p=>(p.buyCurrency||'KRW')==='USD').reduce((s,p)=>s+p.qty*p.buy,0);
  const allValUSD =portfolio.filter(p=>(p.buyCurrency||'KRW')==='USD').reduce((s,p)=>s+p.qty*(p.cur||p.buy),0);
  const allCostKRW=portfolio.filter(p=>(p.buyCurrency||'KRW')==='KRW').reduce((s,p)=>s+p.qty*p.buy,0);
  const allValKRW =portfolio.filter(p=>(p.buyCurrency||'KRW')==='KRW').reduce((s,p)=>s+p.qty*(p.cur||p.buy),0);
  const totalCostKRWe=allCostKRW+allCostUSD*fxRate;
  const totalValKRWe =allValKRW +allValUSD*fxRate;
  const totalGainKRWe=totalValKRWe-totalCostKRWe;
  const totalGainUSDe=(allValUSD-allCostUSD)+(allValKRW-allCostKRW)/fxRate;
  const totalPcte=totalCostKRWe>0?(totalGainKRWe/totalCostKRWe*100):0;
  const showTotalUSD=portTotalCurrency==='USD';
  const totalGainAmt=showTotalUSD?totalGainUSDe:totalGainKRWe;
  const totalGainStr=(totalGainAmt>=0?'+':'')+fmtNative(Math.abs(totalGainAmt),showTotalUSD?'USD':'KRW');
  const totalGainColor=totalGainKRWe>=0?'#30D158':'#FF453A';
  const totalCard=document.createElement('div');
  totalCard.className='port-total-card';
  totalCard.innerHTML=`
    <div class="port-total-label">총 수익 (전체)</div>
    <div class="port-total-amt" style="color:${totalGainColor}" onclick="togglePortTotalCurrency()">${totalGainStr}</div>
    <div class="port-total-pct" style="color:${totalGainColor}">${totalPcte>=0?'+':''}${totalPcte.toFixed(2)}%</div>
    <button class="port-total-toggle" onclick="togglePortTotalCurrency()">${showTotalUSD?'$ → ₩':'₩ → $'}</button>`;
  container.appendChild(totalCard);

  // ── Build group map ──
  const grouped={};
  portfolio.forEach(p=>{
    const gid=p.groupId||'__none__';
    if(!grouped[gid]) grouped[gid]=[];
    grouped[gid].push(p);
  });

  const renderGroup=(g,stocks)=>{
    const sec=document.createElement('div');
    sec.className='group-section';
    const gid=g.id;
    const defaultCur=stocks[0]?.buyCurrency||'USD';
    if(!groupCurrencies[gid]) groupCurrencies[gid]=defaultCur;
    const gc=groupCurrencies[gid];
    const gCost=stocks.reduce((s,p)=>s+p.qty*p.buy,0);
    const gVal =stocks.reduce((s,p)=>s+p.qty*(p.cur||p.buy),0);
    const gGain=gVal-gCost;
    const gPct =gCost>0?(gGain/gCost*100):0;
    const gc2=gGain>=0?'#34C759':'#FF3B30';
    const gStr=(gGain>=0?'+':'')+fmtNative(Math.abs(gGain),gc);
    const hdr=document.createElement('div');
    hdr.className='group-hdr';
    hdr.innerHTML=`
      <div class="group-hdr-left">
        <span class="group-name">${g.name}</span>
        ${gid!=='__none__'?`<button class="group-rename-btn" onclick="openRenameGroupModal('${gid}')">이름 변경</button>`:''}
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="group-return" onclick="toggleGroupCurrency('${gid}')">
          <div class="group-return-amt" style="color:${gc2}">${gStr}</div>
          <div style="font-size:10px;color:${gc2}">${gPct>=0?'+':''}${gPct.toFixed(2)}% · 탭하면 ${gc==='USD'?'₩':'$'}</div>
        </div>
        <button class="group-add-btn" onclick="openStockModal(null,'${gid}')">+</button>
      </div>`;
    sec.appendChild(hdr);
    const stockList=document.createElement('div');
    stockList.className='group-stocks';
    stocks.forEach(p=>{
      const bc=p.buyCurrency||'KRW';
      const cur=p.cur||p.buy;
      const cost=p.qty*p.buy, val=p.qty*cur, gain=val-cost;
      const r=cost>0?(val-cost)/cost*100:0;
      const d=document.createElement('div');
      d.className='stock-item';
      const ts=p.updatedAt?`<span style="font-size:10px;color:var(--label)">${p.updatedAt}</span>`
        :`<span style="font-size:10px;color:var(--orange)">로딩중…</span>`;
      d.innerHTML=`<div class="stock-ico">${stockLogoHtml(p.ticker,p.name)}</div>
        <div class="stock-info">
          <div class="stock-name">${p.name}</div>
          <div class="stock-sub">${p.ticker?p.ticker+' · ':''} ${p.qty}주 · 주당 ${fmtNative(cur,bc)}</div>
          ${ts}
        </div>
        <div class="stock-right">
          <div class="stock-val" id="sv-${p.id}">${fmtNative(val,bc)}</div>
          <div class="stock-ret ${r>=0?'ret-pos':'ret-neg'}" id="sr-${p.id}">${gain>=0?'+':''}${fmtNative(Math.abs(gain),bc)} (${r>=0?'+':''}${r.toFixed(2)}%)</div>
        </div>
        <button class="edit-stock-btn" onclick="event.stopPropagation();openStockModal('${p.id}')">편집</button>`;
      d.onclick=()=>openStockDetail(p.id);
      stockList.appendChild(d);
    });
    sec.appendChild(stockList);
    container.appendChild(sec);
  };

  // Named groups (with or without stocks)
  groups.forEach(g=>{
    const stocks=grouped[g.id]||[];
    if(stocks.length){
      renderGroup(g,stocks);
    } else {
      const sec=document.createElement('div');
      sec.className='group-section';
      sec.innerHTML=`<div class="group-hdr">
        <div class="group-hdr-left">
          <span class="group-name">${g.name}</span>
          <button class="group-rename-btn" onclick="openRenameGroupModal('${g.id}')">이름 변경</button>
        </div>
        <button class="group-add-btn" onclick="openStockModal(null,'${g.id}')">+</button>
      </div>
      <div style="background:var(--card);border-radius:var(--r);padding:16px;text-align:center;color:var(--label);font-size:14px">종목을 추가해보세요 📊</div>`;
      container.appendChild(sec);
    }
  });
  if(grouped['__none__']?.length) renderGroup({id:'__none__',name:'미분류'},grouped['__none__']);
  if(!portfolio.length && !groups.length){
    const empty=document.createElement('div');
    empty.style.cssText='margin:0 16px;background:var(--card);border-radius:var(--r);padding:32px;text-align:center;color:var(--label);font-size:14px';
    empty.textContent='그룹을 만들고 종목을 추가해보세요 📊';
    container.appendChild(empty);
  }

  const newGroupBtn=document.createElement('div');
  newGroupBtn.className='new-group-card';
  newGroupBtn.innerHTML=`<div style="width:22px;height:22px;background:var(--blue);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px">+</div><span style="font-size:14px">새 그룹 만들기</span>`;
  newGroupBtn.onclick=openNewGroupModal;
  container.appendChild(newGroupBtn);
}

async function refreshAllPrices(){
  for(const p of portfolio){
    if(!p.ticker)continue;
    const price=await fetchPrice(p.ticker);
    if(price!==null){
      p.cur=price;
      const now=new Date();
      p.updatedAt=`${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} 기준`;
      ss('port',portfolio);
      const bc=p.buyCurrency||'KRW';
      const cost=p.qty*p.buy, val=p.qty*price, gain=val-cost;
      const r=cost>0?(val-cost)/cost*100:0;
      const svEl=document.getElementById('sv-'+p.id);
      const srEl=document.getElementById('sr-'+p.id);
      if(svEl)svEl.textContent=fmtNative(val,bc);
      if(srEl){
        srEl.textContent=`${gain>=0?'+':''}${fmtNative(gain,bc)} (${r>=0?'+':''}${r.toFixed(2)}%)`;
        srEl.className='stock-ret '+(r>=0?'ret-pos':'ret-neg');
      }
    }
  }
  // Re-render summary block with updated prices
  renderPortfolio();
}

function selectBuyCur(cur){
  selBuyCur=cur;
  document.getElementById('buyCurKRW').classList.toggle('sel',cur==='KRW');
  document.getElementById('buyCurUSD').classList.toggle('sel',cur==='USD');
}

function openStockModal(id, preGroupId){
  editingStockId=id||null;
  const s=id?portfolio.find(p=>p.id===id):null;
  document.getElementById('stkTitle').textContent=s?'종목 수정':'종목 추가';
  document.getElementById('stkName').value=s?s.name:'';
  document.getElementById('stkTicker').value=s?s.ticker:'';
  document.getElementById('stkQty').value=s?s.qty:'';
  document.getElementById('stkBuy').value=s?s.buy:'';
  document.getElementById('stkPriceStatus').textContent='';
  document.getElementById('stkSubBtn').textContent=s?'수정하기':'저장하기';
  selectBuyCur(s?.buyCurrency||'KRW');
  // Group chips
  selGroupId=s?.groupId||preGroupId||null;
  const cr=document.getElementById('groupChipRow'); cr.innerHTML='';
  [{id:null,name:'그룹 없음'},...groups].forEach(g=>{
    const chip=document.createElement('button');
    chip.className='chip'+(selGroupId===g.id?' sel':'');
    chip.textContent=g.name;
    chip.onclick=()=>{selGroupId=g.id;document.querySelectorAll('#groupChipRow .chip').forEach(c=>c.classList.toggle('sel',c.textContent===g.name))};
    cr.appendChild(chip);
  });
  openOv('stockOverlay');
}

async function submitStock(){
  const name=document.getElementById('stkName').value.trim();
  const ticker=document.getElementById('stkTicker').value.trim();
  const qty=parseFloat(document.getElementById('stkQty').value);
  const buy=parseFloat(document.getElementById('stkBuy').value);
  if(!name||!qty||!buy)return;
  const statusEl=document.getElementById('stkPriceStatus');
  const btn=document.getElementById('stkSubBtn');
  btn.disabled=true;btn.textContent='가격 조회중…';
  let cur=null;
  if(ticker){
    statusEl.textContent='📡 현재가 조회 중…';
    cur=await fetchPrice(ticker);
    statusEl.textContent=cur?`✅ 현재가: ${fmtPrice(cur)}`:'⚠️ 가격 조회 실패 — 저장 후 새로고침 시 재시도';
  }
  const now=new Date();
  const updatedAt=cur?`${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} 기준`:null;
  if(editingStockId){
    const idx=portfolio.findIndex(p=>p.id===editingStockId);
    portfolio[idx]={...portfolio[idx],name,ticker,qty,buy,buyCurrency:selBuyCur,groupId:selGroupId,cur:cur??portfolio[idx].cur,updatedAt:updatedAt??portfolio[idx].updatedAt};
  }else{portfolio.push({id:Date.now(),name,ticker,qty,buy,buyCurrency:selBuyCur,groupId:selGroupId,cur,updatedAt})}
  ss('port',portfolio);btn.disabled=false;btn.textContent='저장하기';
  closeOv('stockOverlay');renderPortfolio();
}

function openStockDetail(id){
  const s=portfolio.find(p=>p.id===id);if(!s)return;
  editingStockId=id;
  document.getElementById('stkDtName').textContent=s.name;
  const bc=s.buyCurrency||'KRW';
  const cur=s.cur||s.buy;
  const cost=s.qty*s.buy, val=s.qty*cur;
  const r=cost>0?(val-cost)/cost*100:0;
  const rows=[['종목명',s.name],['티커',s.ticker||'-'],['수량',s.qty+'주'],
    ['매입통화',bc==='USD'?'$ 달러 (USD)':'₩ 원 (KRW)'],
    ['매입단가',fmtNative(s.buy,bc)],['현재가',s.cur?fmtNative(s.cur,bc):'미조회'],
    ['총 투자금',fmtNative(cost,bc)],['총 평가금',fmtNative(val,bc)],
    ['수익률',(r>=0?'+':'')+r.toFixed(2)+'%'],['업데이트',s.updatedAt||'-']];
  document.getElementById('stkDtRows').innerHTML=rows.map(([k,v])=>
    `<div class="detail-row"><span class="dk">${k}</span><span class="dv">${v}</span></div>`).join('');
  openOv('stkDetailOv');
}

function deleteStock(){
  portfolio=portfolio.filter(p=>p.id!==editingStockId);
  ss('port',portfolio);closeOv('stkDetailOv');renderPortfolio();
}

async function refreshMarket(){
  document.getElementById('mktTime').textContent='시장 데이터 불러오는 중…';
  try{
    const r=await fetch('/api/fx');
    if(r.ok){const d=await r.json();const krw=d.krw;
      if(krw){fxRate=krw;document.getElementById('m-fx').textContent=krw.toFixed(1);
        document.getElementById('mc-fx').textContent='₩/USD';document.getElementById('mc-fx').className='mkt-chg mkt-flat';}}
  }catch{}
  const indices=[{sym:'^GSPC',v:'m-sp',c:'mc-sp'},{sym:'^DJI',v:'m-dw',c:'mc-dw'},
    {sym:'^IXIC',v:'m-nd',c:'mc-nd'},{sym:'^KS11',v:'m-ks',c:'mc-ks'},{sym:'^KQ11',v:'m-kq',c:'mc-kq'}];
  let loaded=0;
  for(const idx of indices){
    try{
      const r=await fetch(`/api/quote?symbol=${encodeURIComponent(idx.sym)}`);
      if(r.ok){const d=await r.json();
        if(d.price!=null){const price=d.price,chg=d.change??0;
          const vEl=document.getElementById(idx.v),cEl=document.getElementById(idx.c);
          if(vEl)vEl.textContent=price>=1000?price.toLocaleString('en',{maximumFractionDigits:0}):price.toFixed(2);
          if(cEl){cEl.textContent=(chg>=0?'+':'')+chg.toFixed(2)+'%';
            cEl.className='mkt-chg '+(chg>0?'mkt-up':chg<0?'mkt-dn':'mkt-flat');}loaded++;
        }}
    }catch{}
  }
  const now=new Date();
  document.getElementById('mktTime').textContent=loaded>0
    ?`시장 데이터 · ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} 기준`
    :'시장 데이터 · 브라우저 환경에서는 제한될 수 있어요';
}

function switchLoginTab(tab){
  document.getElementById('ltLogin').classList.toggle('active',tab==='login');
  document.getElementById('ltSignup').classList.toggle('active',tab==='signup');
  document.getElementById('loginForm').style.display=tab==='login'?'':'none';
  document.getElementById('signupForm').style.display=tab==='signup'?'':'none';
}

async function doLogin(){
  const user=document.getElementById('loginUser').value.trim();
  const pw=document.getElementById('loginPw').value;
  const err=document.getElementById('loginErr');
  if(!user||!pw){err.textContent='아이디와 비밀번호를 입력해주세요';return}
  if(fbAuth){
    try{
      const email=`${user}@akkeuseuja.app`;
      await fbAuth.signInWithEmailAndPassword(email,pw);
      // onAuthStateChanged handles the rest
    } catch(e){
      if(e.code==='auth/user-not-found'||e.code==='auth/invalid-credential') err.textContent='아이디 또는 비밀번호가 틀렸어요';
      else if(e.code==='auth/wrong-password') err.textContent='비밀번호가 틀렸어요';
      else err.textContent='로그인 실패: '+e.message;
    }
  }
}

async function doSignup(){
  const user=document.getElementById('signupUser').value.trim();
  const pw=document.getElementById('signupPw').value;
  const err=document.getElementById('signupErr');
  if(!user||!pw){err.textContent='아이디와 비밀번호를 입력해주세요';return}
  if(pw.length<4){err.textContent='비밀번호는 4자 이상이어야 해요';return}
  if(fbAuth){
    try{
      const email=`${user}@akkeuseuja.app`;
      await fbAuth.createUserWithEmailAndPassword(email,pw);
      // onAuthStateChanged handles the rest
    } catch(e){
      if(e.code==='auth/email-already-in-use') err.textContent='이미 사용중인 아이디예요';
      else err.textContent='가입 실패: '+e.message;
    }
  }
}

async function logout(){
  if(!confirm('로그아웃 할까요?'))return;
  if(fbAuth) await fbAuth.signOut();
  setCurrentUser(null);loadLocalData();renderSettings();render();
}

// DATA MANAGEMENT
// ═══════════════════════════════════════════
function exportData(){
  const data={transactions,portfolio,watchlist,incCats,expCats,user:getCurrentUser(),exported:new Date().toISOString()};
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
  a.download=`moodie_money_${getCurrentUser()||'guest'}_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function importData(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(confirm('기존 데이터를 덮어씁니다. 계속할까요?')){
        if(d.transactions){transactions=d.transactions;ss('tx',transactions)}
        if(d.portfolio){portfolio=d.portfolio;ss('port',portfolio)}
        if(d.watchlist){watchlist=d.watchlist;ss('watch',watchlist)}
        if(d.incCats){incCats=d.incCats;ss('inc',incCats)}
        if(d.expCats){expCats=d.expCats;ss('exp',expCats)}
        alert('불러오기 완료!');render();
      }
    }catch{alert('올바른 JSON 파일이 아닙니다.')}
  };
  reader.readAsText(file);e.target.value='';
}

function resetData(){
  if(!confirm('모든 데이터를 삭제할까요?'))return;
  ['tx','port','watch','inc','exp'].forEach(k=>localStorage.removeItem(uKey(k)));
  loadUserData();render();alert('초기화 완료');
}

// ═══════════════════════════════════════════
// CARD SUMMARY
// ═══════════════════════════════════════════
function renderCardSummary(){
  const row = document.getElementById('cardSummaryRow');
  row.innerHTML = '';
  const txs = mTxs().filter(t => !t.isInc); // expenses only
  CARDS.forEach(card => {
    const cardTxs = txs.filter(t => t.card === card);
    const total = cardTxs.reduce((s,t) => s+t.amount, 0);
    const chip = document.createElement('button');
    chip.className = 'card-sum-chip' + (cardTxs.length ? ' has-txs' : '');
    chip.innerHTML = `<span class="csc-name">💳 ${card}</span>
      <span class="csc-amt">${total > 0 ? fmt(total) : '-'}</span>
      <span class="csc-cnt">${cardTxs.length ? cardTxs.length+'건' : '내역 없음'}</span>`;
    chip.onclick = () => openCardDetail(card);
    row.appendChild(chip);
  });
}

function openCardDetail(card){
  const txs = mTxs().filter(t => !t.isInc && t.card === card);
  const total = txs.reduce((s,t) => s+t.amount, 0);
  const MO=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('cardDetailTitle').textContent = `${card} · ${MO[curMonth]}`;
  document.getElementById('cardDetailTotal').textContent = fmt(total);
  document.getElementById('cardDetailCount').textContent = txs.length + '건';

  const list = document.getElementById('cardDetailList');
  if(!txs.length){
    list.innerHTML = '<div class="tx-empty">이 달에 사용 내역이 없어요</div>';
    openOv('cardDetailOv'); return;
  }
  list.innerHTML = '';
  [...txs].reverse().forEach(tx => {
    const cat = [...incCats,...expCats].find(c=>c.key===tx.cat)||{icon:'📝',key:tx.cat};
    const d = document.createElement('div');
    d.className = 'tx-item';
    d.innerHTML = `<div class="tx-ico" style="background:#FF3B3020">${cat.icon}</div>
      <div class="tx-info">
        <div class="tx-cat">${cat.key}${tx.item?' · '+tx.item:''}</div>
        <div class="tx-sub">${[tx.place, tx.memo].filter(Boolean).join(' · ') || '메모 없음'}</div>
      </div>
      <div class="tx-right">
        <div class="tx-amt exp">-${fmt(tx.amount)}</div>
        <div class="tx-dt">${tx.date}</div>
      </div>`;
    list.appendChild(d);
  });
  openOv('cardDetailOv');
}

// ═══════════════════════════════════════════
// MODAL HELPERS
// ═══════════════════════════════════════════
function openOv(id){document.getElementById(id).classList.add('open')}
function closeOv(id){document.getElementById(id).classList.remove('open')}
function bgClose(e,id){if(e.target===document.getElementById(id))closeOv(id)}
